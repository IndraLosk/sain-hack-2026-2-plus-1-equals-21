<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Эксперт как плейлист — доказательные программы здоровья</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-assistant.safe { border-color: #10b981; box-shadow: 0 0 0 1px #10b981 inset; }
    .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scroll-thin::-webkit-scrollbar { width: 8px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
<div class="max-w-6xl mx-auto p-4 md:p-8">
  <header class="flex flex-wrap items-end justify-between gap-3 mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold">Эксперт как плейлист</h1>
      <p class="text-slate-500 text-sm mt-1">Одна доказательная база — разные стили подачи. LangGraph + ChromaDB + qwen2.5:7b (локально).</p>
    </div>
    <div class="flex gap-2 text-xs">
      <span id="health" class="px-3 py-1 rounded-full bg-slate-200">проверка бэкенда…</span>
      <button id="btn-articles" class="px-3 py-1 rounded-full bg-indigo-600 text-white hover:bg-indigo-700">+ Добавить исследование</button>
    </div>
  </header>

  <!-- Витрина программ -->
  <section class="mb-6">
    <h2 class="text-xs uppercase tracking-wider text-slate-500 mb-2">Программы</h2>
    <div id="programs" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
  </section>

  <!-- Рабочая область -->
  <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="flex flex-wrap items-center justify-between gap-3 p-3 border-b border-slate-200 bg-slate-50">
      <div id="experts" class="flex gap-2"></div>
      <div class="flex items-center gap-2">
        <span id="session-label" class="text-xs text-slate-400"></span>
        <button id="btn-reset" class="text-xs px-3 py-1 rounded-lg border border-slate-300 hover:bg-slate-100">Новый диалог</button>
      </div>
    </div>

    <div id="messages" class="p-4 space-y-4 h-[52vh] overflow-y-auto scroll-thin"></div>

    <form id="chat-form" class="p-3 border-t border-slate-200 flex gap-2 bg-slate-50">
      <input id="chat-input" autocomplete="off" placeholder="Например: как быстрее уснуть?"
             class="flex-1 rounded-xl border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <button id="send" class="px-5 py-2 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 disabled:opacity-50">Спросить</button>
    </form>
  </section>

  <p class="text-xs text-slate-400 mt-4">
    Демо не назначает дозировки препаратов и не ставит диагнозы. Источники — научные статьи из локальной базы ChromaDB.
  </p>
</div>

<!-- Модальное окно куратора -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl w-full max-w-xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center">
      <h3 class="font-semibold text-lg">Добавить исследование</h3>
      <button id="modal-close" class="text-slate-400 hover:text-slate-700 text-xl">×</button>
    </div>
    <form id="article-form" class="space-y-3">
      <div>
        <label class="text-xs text-slate-500">Название</label>
        <input name="title" required class="w-full rounded-lg border border-slate-300 px-3 py-2" placeholder="Kiwi before bedtime and sleep onset" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-500">Дата публикации</label>
          <input name="published_date" type="date" required class="w-full rounded-lg border border-slate-300 px-3 py-2" />
        </div>
        <div>
          <label class="text-xs text-slate-500">Программа</label>
          <select name="program_id" id="article-program" class="w-full rounded-lg border border-slate-300 px-3 py-2"></select>
        </div>
      </div>
      <div>
        <label class="text-xs text-slate-500">Текст статьи</label>
        <textarea name="content" rows="6" required class="w-full rounded-lg border border-slate-300 px-3 py-2"
                  placeholder="В пилотном исследовании употребление двух плодов киви за 60 минут до сна…"></textarea>
      </div>
      <div class="flex items-center justify-between">
        <span id="article-status" class="text-xs text-slate-500"></span>
        <button class="px-4 py-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700">Отправить в базу</button>
      </div>
    </form>
    <div id="article-list" class="text-xs text-slate-500 space-y-1"></div>
  </div>
</div>

<script>
const state = {
  catalog: null,
  programId: localStorage.getItem('program_id') || 'sleep_recovery',
  expertId: localStorage.getItem('expert_id') || 'clinician',
  sessionId: localStorage.getItem('session_id') || crypto.randomUUID(),
  streaming: false,
};
localStorage.setItem('session_id', state.sessionId);

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

// ---------------------------------------------------------------- каталог
async function loadCatalog() {
  state.catalog = await api('/api/v1/catalog');
  if (!state.catalog.programs.find(p => p.id === state.programId)) state.programId = state.catalog.programs[0].id;
  if (!state.catalog.experts.find(e => e.id === state.expertId)) state.expertId = state.catalog.experts[0].id;
  renderPrograms();
  renderExperts();
  renderArticlePrograms();
}

function renderPrograms() {
  const wrap = $('programs');
  wrap.innerHTML = '';
  state.catalog.programs.forEach((p) => {
    const active = p.id === state.programId;
    const card = el('button', `text-left rounded-2xl p-4 border transition ${active ? 'bg-white border-indigo-500 ring-2 ring-indigo-200' : 'bg-white/70 border-slate-200 hover:border-indigo-300'}`);
    card.style.borderTopColor = p.cover_color;
    card.style.borderTopWidth = '4px';
    card.appendChild(el('div', 'font-semibold', p.title));
    card.appendChild(el('div', 'text-xs text-slate-500 mt-1', p.description));
    card.appendChild(el('div', `text-xs mt-2 font-medium ${active ? 'text-indigo-600' : 'text-slate-400'}`, active ? '● активна' : 'выбрать'));
    card.onclick = () => {
      state.programId = p.id;
      localStorage.setItem('program_id', p.id);
      renderPrograms();
    };
    wrap.appendChild(card);
  });
}

function renderExperts() {
  const wrap = $('experts');
  wrap.innerHTML = '';
  state.catalog.experts.forEach((e) => {
    const active = e.id === state.expertId;
    const tab = el('button', `px-3 py-2 rounded-xl text-sm flex items-center gap-2 border ${active ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-300 hover:bg-slate-100'}`);
    tab.appendChild(el('span', 'font-medium', e.name));
    tab.appendChild(el('span', `text-[10px] px-2 py-0.5 rounded-full ${active ? 'bg-white/20' : 'bg-slate-100 text-slate-500'}`, e.role_badge));
    tab.onclick = () => {
      state.expertId = e.id;
      localStorage.setItem('expert_id', e.id);
      renderExperts();
      addSystemNote(`Стиль переключён: ${e.name}. История диалога сохранена.`);
    };
    wrap.appendChild(tab);
  });
}

function renderArticlePrograms() {
  const select = $('article-program');
  select.innerHTML = '';
  state.catalog.programs.forEach((p) => {
    const opt = el('option', '', p.title);
    opt.value = p.id;
    if (p.id === state.programId) opt.selected = true;
    select.appendChild(opt);
  });
}

// ---------------------------------------------------------------- сообщения
function addSystemNote(text) {
  const note = el('div', 'text-center text-xs text-slate-400', text);
  messagesEl.appendChild(note);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addUserMessage(text) {
  const row = el('div', 'flex justify-end');
  const bubble = el('div', 'max-w-[80%] bg-indigo-600 text-white rounded-2xl rounded-br-sm px-4 py-2 whitespace-pre-wrap', text);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addAssistantShell(expertName) {
  const row = el('div', 'flex justify-start');
  const bubble = el('div', 'msg-assistant max-w-[85%] bg-white border border-slate-200 rounded-2xl rounded-bl-sm px-4 py-3');
  const head = el('div', 'flex items-center gap-2 mb-1');
  head.appendChild(el('span', 'text-xs font-semibold text-slate-600', expertName));
  const badge = el('span', 'hidden text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-medium', 'Безопасный шаг без препаратов');
  head.appendChild(badge);
  const body = el('div', 'text-sm whitespace-pre-wrap leading-relaxed typing');
  const sources = el('div', 'mt-2 text-xs');
  bubble.appendChild(head);
  bubble.appendChild(body);
  bubble.appendChild(sources);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { bubble, body, badge, sources };
}

function renderSources(container, items) {
  container.innerHTML = '';
  if (!items || !items.length) return;
  const details = el('details', 'mt-1');
  const summary = el('summary', 'cursor-pointer text-slate-500 hover:text-slate-700', `Источники (${items.length})`);
  details.appendChild(summary);
  const list = el('div', 'mt-2 space-y-1');
  items.forEach((s) => {
    const chip = el('div', 'flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1');
    chip.appendChild(el('span', 'font-medium text-slate-700', s.title));
    if (s.date) chip.appendChild(el('span', 'text-slate-400', s.date));
    if (s.is_new) chip.appendChild(el('span', 'px-1.5 py-0.5 rounded bg-emerald-500 text-white text-[10px] font-bold', 'NEW'));
    chip.appendChild(el('span', 'text-slate-400', `${s.article_id}${s.section_id ? ' / ' + s.section_id : ''}`));
    list.appendChild(chip);
  });
  details.appendChild(list);
  container.appendChild(details);
}

// ---------------------------------------------------------------- отправка
async function sendMessage(text) {
  if (state.streaming) return;
  state.streaming = true;
  $('send').disabled = true;
  addUserMessage(text);
  const expert = state.catalog.experts.find(e => e.id === state.expertId);
  const shell = addAssistantShell(expert ? expert.name : state.expertId);

  try {
    const res = await fetch('/api/v1/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: state.sessionId,
        program_id: state.programId,
        expert_id: state.expertId,
        message: text,
      }),
    });
    if (!res.ok) throw new Error(await res.text());

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let event;
        try { event = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (event.type === 'safety_flag') {
          if (event.triggered) {
            shell.badge.classList.remove('hidden');
            shell.bubble.classList.add('safe');
          }
        } else if (event.type === 'sources') {
          renderSources(shell.sources, event.items);
        } else if (event.type === 'token') {
          shell.body.textContent += event.content;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (event.type === 'error') {
          shell.body.textContent += `\n[ошибка: ${event.message}]`;
        } else if (event.type === 'done') {
          shell.body.classList.remove('typing');
        }
      }
    }
  } catch (err) {
    shell.body.textContent += `\n[ошибка сети: ${err.message}]`;
  } finally {
    shell.body.classList.remove('typing');
    state.streaming = false;
    $('send').disabled = false;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

// ---------------------------------------------------------------- история
async function loadHistory() {
  try {
    const data = await api(`/api/v1/chat/history?session_id=${encodeURIComponent(state.sessionId)}`);
    messagesEl.innerHTML = '';
    if (!data.messages.length) {
      addSystemNote('Диалог пуст. Выберите программу и эксперта, затем задайте вопрос.');
      return;
    }
    data.messages.forEach((m) => {
      if (m.role === 'user') {
        addUserMessage(m.content);
      } else {
        const expert = state.catalog.experts.find(e => e.id === m.expert_id);
        const shell = addAssistantShell(expert ? expert.name : 'Эксперт');
        shell.body.classList.remove('typing');
        shell.body.textContent = m.content;
        if (m.safety_flag) { shell.badge.classList.remove('hidden'); shell.bubble.classList.add('safe'); }
        renderSources(shell.sources, m.sources);
      }
    });
  } catch (err) {
    addSystemNote('Не удалось загрузить историю: ' + err.message);
  }
}

// ---------------------------------------------------------------- события
$('chat-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendMessage(text);
});

$('btn-reset').addEventListener('click', async () => {
  await fetch(`/api/v1/chat/history?session_id=${encodeURIComponent(state.sessionId)}`, { method: 'DELETE' });
  state.sessionId = crypto.randomUUID();
  localStorage.setItem('session_id', state.sessionId);
  $('session-label').textContent = state.sessionId.slice(0, 8);
  messagesEl.innerHTML = '';
  addSystemNote('Новый диалог создан.');
});

$('btn-articles').addEventListener('click', async () => {
  $('modal').classList.remove('hidden');
  $('modal').classList.add('flex');
  await refreshArticles();
});
$('modal-close').addEventListener('click', () => {
  $('modal').classList.add('hidden');
  $('modal').classList.remove('flex');
});

$('article-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const payload = {
    title: form.get('title'),
    published_date: form.get('published_date'),
    program_id: form.get('program_id'),
    content: form.get('content'),
  };
  $('article-status').textContent = 'Отправка…';
  try {
    const res = await api('/api/v1/articles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    $('article-status').textContent = `Принято (${res.article_id}), чанков: ${res.chunks_planned}. Индексация в фоне…`;
    e.target.reset();
    setTimeout(refreshArticles, 1500);
    setTimeout(refreshArticles, 4000);
  } catch (err) {
    $('article-status').textContent = 'Ошибка: ' + err.message;
  }
});

async function refreshArticles() {
  try {
    const items = await api('/api/v1/articles');
    const wrap = $('article-list');
    wrap.innerHTML = '';
    wrap.appendChild(el('div', 'font-medium text-slate-600 mt-2', `В базе статей: ${items.length}`));
    items.slice(0, 8).forEach((a) => {
      const row = el('div', 'flex items-center gap-2');
      row.appendChild(el('span', 'text-slate-700', a.title));
      row.appendChild(el('span', 'text-slate-400', a.published_date));
      if (a.is_new) row.appendChild(el('span', 'px-1.5 py-0.5 rounded bg-emerald-500 text-white text-[10px] font-bold', 'NEW'));
      wrap.appendChild(row);
    });
  } catch (err) { /* ignore */ }
}

async function checkHealth() {
  try {
    const h = await api('/api/v1/health');
    const badge = $('health');
    const ok = h.status === 'ok';
    badge.textContent = `${ok ? 'LLM online' : 'LLM offline'} · ${h.llm.model} · чанков: ${h.vector_store.chunks}`;
    badge.className = `px-3 py-1 rounded-full ${ok ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`;
  } catch {
    $('health').textContent = 'бэкенд недоступен';
  }
}

(async function init() {
  $('session-label').textContent = state.sessionId.slice(0, 8);
  await loadCatalog();
  await loadHistory();
  checkHealth();
  $('chat-input').focus();
})();
</script>
</body>
</html>
